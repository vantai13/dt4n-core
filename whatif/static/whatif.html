<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DT4N · Thử trước khi làm (what-if)</title>
<style>
  /* Màu lấy từ dashboard (dashboard/src), giữ tiết chế: ít phát sáng, chữ thường. */
  :root { --bg:#0f172a; --panel:#1e293b; --line:#334155; --ink:#e2e8f0; --muted:#94a3b8;
          --dim:#64748b; --cyan:#00F7F7; --host:#0ea5e9; --switch:#f97316;
          --ok:#22d3ee; --warm:#f97316; --hot:#ef4444; --off:#475569; --input:#020617; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--muted);
               font:14px/1.5 Arial, sans-serif; }
  .app { display:flex; flex-direction:column; min-height:100vh; }
  .app-header { display:flex; align-items:baseline; justify-content:space-between; gap:12px;
                padding:16px 24px; border-bottom:1px solid var(--line); }
  .brand { color:var(--cyan); font-size:1.15rem; font-weight:700; }
  .sub { color:var(--dim); font-size:0.85rem; }
  .main { display:grid; grid-template-columns:minmax(0,1fr) 340px; flex:1; min-height:0; }
  @media (max-width: 1000px) { .main { grid-template-columns:1fr; } }
  .results { min-width:0; padding:20px 24px; }
  .side { background:var(--panel); border-left:1px solid var(--line); padding:20px; }
  h2 { color:var(--ink); font-size:1rem; margin:0 0 12px; }
  .group { padding-bottom:16px; margin-bottom:16px; border-bottom:1px solid var(--line); }
  .group h3 { color:var(--cyan); font-size:0.9rem; margin:0 0 6px; }
  label { display:block; margin:10px 0 4px; color:var(--muted); font-size:0.82rem; }
  select, input[type=number] { width:100%; min-width:0; background:var(--input); border:1px solid var(--line);
         border-radius:6px; color:var(--ink); padding:7px 9px; font:inherit; }
  select:focus, input:focus { outline:none; border-color:var(--host); }
  .row { display:flex; gap:8px; align-items:end; }
  .row > * { flex:1; min-width:0; }
  .check { display:flex; gap:8px; align-items:flex-start; margin:10px 0 0; color:var(--muted); font-size:0.85rem; }
  .check input { margin-top:3px; accent-color:var(--host); }
  button { font:inherit; border-radius:6px; cursor:pointer; }
  .btn-add { flex:0 0 auto; background:transparent; color:var(--ink); border:1px solid var(--line); padding:7px 12px; }
  .btn-add:hover { border-color:var(--muted); }
  .btn-ask { width:100%; border:none; padding:10px; background:var(--host); color:#fff; font-weight:700; }
  .btn-ask:hover { background:#0284c7; }
  button.x { flex:0 0 auto; background:transparent; border:none; color:var(--dim); padding:0 2px; font-size:0.8rem; }
  button.x:hover { color:#fca5a5; }
  .action { background:var(--bg); border:1px solid var(--line); border-radius:6px; padding:8px 10px; margin-top:8px; }
  .action .title { color:var(--ink); font-size:0.88rem; display:flex; justify-content:space-between; align-items:center; }
  .action label { margin-top:6px; }
  .empty { color:var(--dim); font-size:0.85rem; margin-top:8px; }
  .meta { color:var(--muted); font-size:0.85rem; margin:0 0 14px; }
  .warn { border-left:3px solid #f59e0b; background:#1f1a0b; color:#fcd34d; padding:8px 12px;
          margin:0 0 14px; font-size:0.85rem; }
  .warn ul { margin:4px 0 0; padding-left:18px; }
  .error { border-left:3px solid var(--hot); background:#2a1414; color:#fca5a5; padding:8px 12px; margin-bottom:14px; }
  .placeholder { color:var(--dim); padding:48px 0; text-align:center; }
  .topos { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
  @media (max-width: 1300px) { .topos { grid-template-columns:1fr; } }
  .topo h3 { color:var(--muted); font-size:0.85rem; font-weight:700; margin:0 0 6px; }
  .diagram { border:1px solid var(--line); border-radius:8px; background:#0b1222; }
  svg { display:block; width:100%; height:auto; }
  svg text { font-size:11px; fill:var(--muted); paint-order:stroke; stroke:#0b1222; stroke-width:3px; }
  svg .node circle { fill:#0b1222; stroke-width:2; }
  svg .node.host circle { stroke:var(--host); }
  svg .node.switch circle { stroke:var(--switch); }
  svg .node text { font-size:12px; fill:var(--ink); }
  .legend { display:flex; gap:16px; flex-wrap:wrap; font-size:0.8rem; margin:10px 0 4px; }
  .legend i { display:inline-block; width:18px; height:3px; vertical-align:middle; margin-right:6px; }
  .hint { color:var(--dim); font-size:0.8rem; margin:0 0 16px; }
  table { border-collapse:collapse; width:100%; }
  th, td { text-align:left; padding:8px 10px; border-bottom:1px solid var(--line); font-variant-numeric:tabular-nums; }
  th { color:var(--muted); font-weight:400; font-size:0.82rem; }
  td { color:var(--ink); }
  td.flag { color:var(--dim); }
  .tag { font-size:0.75rem; margin-left:8px; }
  .tag.flag { color:#fbbf24; }
  .tag.victim { color:#f87171; }
  .tag.dead { color:var(--dim); }
</style>
</head>
<body>
<div class="app">
<header class="app-header">
  <div class="brand">DT4N what-if</div>
  <div class="sub">Dự đoán trên bản số, không gửi lệnh nào xuống mạng</div>
</header>
<div class="main">
  <section class="results" aria-live="polite">
    <h2>Kết quả</h2>
    <div id="out"><div class="placeholder">Chưa có kết quả. Chọn trạng thái và thay đổi ở cột bên phải, rồi bấm Dự đoán.</div></div>
  </section>

  <aside class="side" aria-label="Thiết lập câu hỏi">
    <div class="group">
      <h3>Trạng thái mạng</h3>
      <label for="source">Lấy từ</label>
      <select id="source">
        <option value="twin">Twin đang chạy (Ditto)</option>
        <option value="snapshot">Dữ liệu đã ghi (không cần Ditto)</option>
      </select>
      <div id="snapBox" hidden>
        <div class="row">
          <div><label for="run">Run</label><select id="run"></select></div>
          <div style="flex:0 0 72px"><label for="tick">Giây</label>
            <input id="tick" type="number" min="0" max="59" value="30"></div>
        </div>
      </div>
      <label class="check"><input id="restore" type="checkbox">
        <span>Coi luồng TCP đã giảm tốc sẽ gửi lại đủ mức cấu hình</span></label>
      <label class="check"><input id="stale" type="checkbox">
        <span>Vẫn dự đoán khi dữ liệu twin đã cũ</span></label>
    </div>

    <div class="group">
      <h3>Thay đổi muốn thử</h3>
      <div class="row">
        <select id="newOp" aria-label="Loại thay đổi">
          <option value="setBandwidth">Đặt băng thông link</option>
          <option value="disableLink">Tắt link</option>
          <option value="enableLink">Bật link</option>
          <option value="addDemand">Thêm luồng UDP</option>
        </select>
        <button id="addBtn" class="btn-add">Thêm</button>
      </div>
      <div id="actions"></div>
      <div id="noAction" class="empty">Chưa có thay đổi nào, kết quả sẽ chỉ là trạng thái hiện tại.</div>
    </div>
    <button id="askBtn" class="btn-ask">Dự đoán</button>
  </aside>
</div>
</div>

<script>
'use strict';
const LINKS = ['h1-s1','h2-s1','h3-s1','s1-s2','s1-s3','s2-s3','s2-srv1','s3-srv2'];
const HOSTS = ['h1','h2','h3','srv1','srv2'];
const SWITCHES = new Set(['s1','s2','s3']);
const POS = { h1:[55,60], h2:[55,160], h3:[55,260], s1:[190,160], s2:[340,75], s3:[340,245],
              srv1:[485,75], srv2:[485,245] };
const $ = (id) => document.getElementById(id);
const el = (tag, attrs = {}, text) => {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) n.setAttribute(k, v);
  if (text !== undefined) n.textContent = text;
  return n;
};
const svgEl = (tag, attrs = {}, text) => {
  const n = document.createElementNS('http://www.w3.org/2000/svg', tag);
  for (const [k, v] of Object.entries(attrs)) n.setAttribute(k, v);
  if (text !== undefined) n.textContent = text;
  return n;
};
const TITLE = { 'không làm gì': 'Hiện tại', 'sau hành động': 'Sau thay đổi' };
const title = (l) => TITLE[l] || l;
const fmt = (x) => (x === null || x === undefined) ? '–' : Number(x).toFixed(2);
const short = (name) => name.split('/')[0].replace('->', '→');

// ---------------------------------------------------------------- hành động
function selectOf(options, value) {
  const s = el('select');
  for (const o of options) { const op = el('option', { value: o }, o); s.appendChild(op); }
  if (value) s.value = value;
  return s;
}
function syncEmpty() { $('noAction').hidden = $('actions').children.length > 0; }
function addAction(op) {
  const box = el('div', { class: 'action' });
  box.dataset.op = op;
  const names = { setBandwidth: 'Đặt băng thông', disableLink: 'Tắt link',
                  enableLink: 'Bật link', addDemand: 'Thêm luồng UDP' };
  const title = el('div', { class: 'title' }, names[op]);
  const del = el('button', { class: 'x', 'aria-label': 'Bỏ thay đổi này' }, 'bỏ');
  del.onclick = () => { box.remove(); syncEmpty(); };
  title.appendChild(del);
  box.appendChild(title);
  const row = el('div', { class: 'row' });
  if (op === 'addDemand') {
    row.append(wrap('Từ', selectOf(HOSTS, 'h1'), 'src'), wrap('Tới', selectOf(HOSTS, 'srv1'), 'dst'),
               wrap('Mbps', num(50), 'mbps'));
  } else {
    row.append(wrap('Link', selectOf(LINKS, op === 'setBandwidth' ? 'h1-s1' : 's1-s2'), 'link'));
    if (op === 'setBandwidth') row.append(wrap('Mbps', num(7), 'mbps'));
  }
  box.appendChild(row);
  $('actions').appendChild(box);
  syncEmpty();
}
function num(v) { const i = el('input', { type: 'number', min: '0.1', step: '0.1' }); i.value = v; return i; }
function wrap(text, input, field) {
  const d = el('div'); input.dataset.field = field;
  d.append(el('label', {}, text), input); return d;
}
function readActions() {
  return [...$('actions').children].map((box) => {
    const a = { op: box.dataset.op };
    box.querySelectorAll('[data-field]').forEach((i) => {
      a[i.dataset.field] = i.dataset.field === 'mbps' ? Number(i.value) : i.value;
    });
    if (a.op === 'addDemand') a.kind = 'udp';
    return a;
  });
}

// ---------------------------------------------------------------- vẽ topology
function colorOf(rho, down) {
  if (down) return 'var(--off)';
  return rho >= 1 ? 'var(--hot)' : rho >= 0.7 ? 'var(--warm)' : 'var(--ok)';
}
function drawTopo(pred, title) {
  const wrapDiv = el('div', { class: 'topo' });
  wrapDiv.appendChild(el('h3', {}, title));
  const box = el('div', { class: 'diagram' });
  const svg = svgEl('svg', { viewBox: '0 0 540 320', role: 'img', 'aria-label': title });
  const flagged = new Set(pred.summary.outside_validity);
  for (const key of LINKS) {
    const [a, b] = key.split('-');
    const [x1, y1] = POS[a], [x2, y2] = POS[b];
    const down = pred.down.includes(key);
    const ab = pred.links[`${a}->${b}`], ba = pred.links[`${b}->${a}`];
    const heavy = !ab ? ba : !ba ? ab : (ab.rho >= ba.rho ? ab : ba);
    const dir = heavy === ab ? `${a}→${b}` : `${b}→${a}`;
    const rho = heavy ? heavy.rho : 0;
    const color = colorOf(rho, down);
    const line = svgEl('line', { x1, y1, x2, y2, stroke: color,
      'stroke-width': down ? 2.5 : 2.5 + Math.min(rho, 2) * 1.5, 'stroke-dasharray': down ? '8 6' : '',
      'stroke-linecap': 'round' });
    svg.appendChild(line);
    // nhãn đặt lệch VUÔNG GÓC với đường kẻ (luôn về phía trên/trái) để không đè lên nét
    const len = Math.hypot(x2 - x1, y2 - y1);
    let nx = -(y2 - y1) / len, ny = (x2 - x1) / len;
    if (ny > 0) { nx = -nx; ny = -ny; }
    const lx = (x1 + x2) / 2 + nx * 13, ly = (y1 + y2) / 2 + ny * 13 + 4;
    const anchor = Math.abs(nx) > 0.9 ? (nx < 0 ? 'end' : 'start') : 'middle';
    if (down) svg.appendChild(svgEl('text', { x: lx, y: ly, 'text-anchor': anchor }, 'tắt'));
    else if (heavy && heavy.load > 0.05) {
      const t = svgEl('text', { x: lx, y: ly, 'text-anchor': anchor }, `${dir} ρ ${rho.toFixed(2)}`);
      if (rho >= 0.7) t.setAttribute('style', `fill:${color}`);
      svg.appendChild(t);
    }
  }
  for (const [name, [x, y]] of Object.entries(POS)) {
    const g = svgEl('g', { class: 'node ' + (SWITCHES.has(name) ? 'switch' : 'host') });
    g.append(svgEl('circle', { cx: x, cy: y, r: 18 }),
             svgEl('text', { x, y: y + 34, 'text-anchor': 'middle' }, name));
    svg.appendChild(g);
  }
  box.appendChild(svg);
  wrapDiv.appendChild(box);
  return wrapDiv;
}

// ---------------------------------------------------------------- bảng luồng
function flowTable(result) {
  const labels = Object.keys(result);
  const table = el('table');
  const head = el('tr');
  head.appendChild(el('th', {}, 'Luồng, Mbps tới đích'));
  labels.forEach((l) => head.appendChild(el('th', {}, title(l))));
  table.appendChild(head);
  const names = Object.keys(result[labels[0]].prediction.flows);
  for (const n of names) {
    const tr = el('tr');
    tr.appendChild(el('td', {}, short(n)));
    for (const l of labels) {
      const r = result[l], f = r.prediction.flows[n];
      const td = el('td', {}, f ? fmt(f.delivered) : '–');
      if (f && !f.reachable) td.appendChild(el('span', { class: 'tag dead' }, 'không tới'));
      if (f && f.outside_validity) { td.className = 'flag'; td.appendChild(el('span', { class: 'tag flag' }, 'ngoài vùng hợp lệ')); }
      if (r.new_victims.includes(n)) td.appendChild(el('span', { class: 'tag victim' }, 'nạn nhân mới'));
      tr.appendChild(td);
    }
    table.appendChild(tr);
  }
  return table;
}

// ---------------------------------------------------------------- hỏi server
async function ask() {
  const out = $('out');
  out.replaceChildren(el('div', { class: 'placeholder' }, 'Đang tính...'));
  const payload = { source: $('source').value, restore_nominal: $('restore').checked,
                    allow_stale: $('stale').checked, actions: readActions() };
  if (payload.source === 'snapshot') { payload.run = $('run').value; payload.tick = Number($('tick').value); }
  let body, status;
  try {
    const res = await fetch('/api/ask', { method: 'POST', headers: { 'Content-Type': 'application/json' },
                                          body: JSON.stringify(payload) });
    status = res.status; body = await res.json();
  } catch (e) {
    out.replaceChildren(el('div', { class: 'error' }, 'Không kết nối được tới server what-if: ' + e));
    return;
  }
  out.replaceChildren();
  if (status !== 200) {
    out.appendChild(el('div', { class: 'error' }, `Lỗi ${status}: ${body.error || ''}`));
    if (body.report) out.appendChild(warnList(body.report.warnings));
    return;
  }
  const rep = body.report;
  const age = rep.max_age_s === null ? '' : `, dữ liệu cũ nhất ${rep.max_age_s.toFixed(1)} s`;
  const downTxt = rep.down.length ? `, link đang tắt: ${rep.down.join(', ')}` : '';
  out.appendChild(el('p', { class: 'meta' }, `Trạng thái lấy từ ${rep.source}${age}${downTxt}.`));
  if (rep.warnings.length) out.appendChild(warnList(rep.warnings));
  const topos = el('div', { class: 'topos' });
  for (const [label, r] of Object.entries(body.result)) topos.appendChild(drawTopo(r.prediction, title(label)));
  out.appendChild(topos);
  const legend = el('div', { class: 'legend' });
  [['var(--ok)', 'ρ dưới 0,7'], ['var(--warm)', 'ρ từ 0,7 tới 1'], ['var(--hot)', 'ρ từ 1 trở lên, có mất gói'],
   ['var(--off)', 'link tắt']].forEach(([c, t]) => {
    const s = el('span'); const i = el('i'); i.style.background = c; s.append(i, t); legend.appendChild(s);
  });
  const flagged = Object.values(body.result).some((r) => r.prediction.summary.outside_validity.length);
  const hint = el('p', { class: 'hint' }, 'ρ là tải chia dung lượng, lấy theo chiều nặng hơn của link.' +
    (flagged ? ' Luồng TCP qua link nghẽn được đánh dấu "ngoài vùng hợp lệ". Mô hình không tính được lúc TCP giảm tốc, nên đừng dùng các con số đó để so sánh.' : ''));
  out.append(legend, hint, flowTable(body.result));
}
function warnList(items) {
  const box = el('div', { class: 'warn' });
  box.appendChild(el('div', {}, 'Lưu ý về dữ liệu đầu vào:'));
  const ul = el('ul');
  items.forEach((w) => ul.appendChild(el('li', {}, w)));
  box.appendChild(ul);
  return box;
}

// ---------------------------------------------------------------- khởi động
async function init() {
  $('addBtn').onclick = () => addAction($('newOp').value);
  $('askBtn').onclick = ask;
  $('source').onchange = () => { $('snapBox').hidden = $('source').value !== 'snapshot'; };
  try {
    const res = await fetch('/api/snapshots');
    const data = await res.json();
    for (const r of data.runs) $('run').appendChild(el('option', { value: r }, r));
    $('run').value = data.runs.find((r) => r.startsWith('F-flood-h1')) || data.runs[0];
    $('tick').value = data.default_tick;
  } catch (e) { /* trang vẫn dùng được với nguồn twin */ }
}
init();
</script>
</body>
</html>
